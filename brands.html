<!DOCTYPE html>
<html lang="ro">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CutPays - Pentru Branduri</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body class="bg-gray-50 text-gray-900 font-sans antialiased min-h-screen flex flex-col justify-between">

    <!-- Header -->
    <header class="max-w-7xl w-full mx-auto px-6 py-6 flex items-center justify-between bg-white border-b border-gray-200">
        <div class="flex items-center gap-2">
            <span class="text-2xl font-extrabold text-blue-600">CutPays</span>
            <span class="text-xs bg-purple-100 text-purple-700 px-2.5 py-1 rounded-full font-bold">Brand Portal</span>
        </div>
        <div>
            <a href="index.html" class="text-sm font-semibold text-gray-600 hover:text-blue-600">← Înapoi acasă</a>
        </div>
    </header>

    <!-- Conținut Principal -->
    <main class="max-w-3xl w-full mx-auto px-6 py-12 flex-1">
        <div class="mb-8 text-center">
            <h1 class="text-3xl font-extrabold text-gray-900">Promovează-ți brandul prin sute de creatori</h1>
            <p class="text-gray-600 text-sm mt-2">Lansează o campanie de clipping și plătești doar pentru vizualizările reale obținute.</p>
        </div>

        <div class="bg-white p-8 rounded-2xl border border-gray-200 shadow-sm">
            <h3 class="text-lg font-bold text-gray-900 mb-6">Creează o Campanie Nouă</h3>

            <form onsubmit="event.preventDefault(); alert('Campania a fost trimisă spre moderare! În curând va fi vizibilă pentru creatori.'); window.location.href='index.html';" class="space-y-4">
                <div>
                    <label class="block text-sm font-semibold text-gray-700 mb-1">Numele Brandului / Companiei</label>
                    <input type="text" placeholder="Ex: TechZone Ro" required class="w-full border border-gray-300 rounded-xl p-3 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500" />
                </div>

                <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                    <div>
                        <label class="block text-sm font-semibold text-gray-700 mb-1">Titlul Campaniei</label>
                        <input type="text" placeholder="Ex: Lansare Gadget Tech" required class="w-full border border-gray-300 rounded-xl p-3 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500" />
                    </div>
                    <div>
                        <label class="block text-sm font-semibold text-gray-700 mb-1">Buget / 1k vizualizări (€)</label>
                        <input type="text" placeholder="Ex: 4.00 €" required class="w-full border border-gray-300 rounded-xl p-3 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500" />
                    </div>
                </div>

                <div>
                    <label class="block text-sm font-semibold text-gray-700 mb-1">Descriere și Cerințe pentru Creatori</label>
                    <textarea rows="4" placeholder="Descrie ce trebuie să facă creatorii în clip..." required class="w-full border border-gray-300 rounded-xl p-3 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500"></textarea>
                </div>

                <div>
                    <label class="block text-sm font-semibold text-gray-700 mb-1">Link către Materialul Video (Google Drive / WeTransfer)</label>
                    <input type="url" placeholder="https://drive.google.com/..." required class="w-full border border-gray-300 rounded-xl p-3 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500" />
                </div>

                <button type="submit" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-semibold py-3 px-4 rounded-xl transition shadow-sm mt-4">
                    Publică Campania
                </button>
            </form>
        </div>
    </main>

    <!-- Footer -->
    <footer class="max-w-7xl w-full mx-auto px-6 py-8 border-t border-gray-200 text-center text-xs text-gray-500">
        &copy; 2026 CutPays. Toate drepturile rezervate.
    </footer>

</body>
</html>
