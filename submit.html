<!DOCTYPE html>
<html lang="ro">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CutPays - Trimite Clip</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body class="bg-gray-50 text-gray-900 font-sans antialiased min-h-screen flex flex-col justify-between">

    <!-- Header -->
    <header class="max-w-7xl w-full mx-auto px-6 py-6 flex items-center justify-between bg-white border-b border-gray-200">
        <div class="flex items-center gap-2">
            <span class="text-2xl font-extrabold text-blue-600">CutPays</span>
            <span class="text-xs bg-blue-100 text-blue-700 px-2.5 py-1 rounded-full font-bold">Trimite Lucrare</span>
        </div>
        <div>
            <a href="campaigns.html" class="text-sm font-semibold text-gray-600 hover:text-blue-600">← Înapoi la Campanii</a>
        </div>
    </header>

    <!-- Conținut Principal -->
    <main class="max-w-xl w-full mx-auto px-6 py-12 flex-1 flex items-center justify-center">
        <div class="bg-white p-8 rounded-2xl border border-gray-200 shadow-sm w-full">
            <div class="mb-6 text-center">
                <h1 class="text-2xl font-bold text-gray-900">Trimite Link-ul Clipului</h1>
                <p class="text-gray-500 text-sm mt-1">Introdu link-ul postării tale pentru validare și plată.</p>
            </div>

            <!-- Formular conectat la Formspree -->
            <form action="https://formspree.io/f/xzeewlrk" method="POST" class="space-y-4">
                <div>
                    <label class="block text-sm font-semibold text-gray-700 mb-1">Selectează Platforma</label>
                    <select name="platforma" class="w-full border border-gray-300 rounded-xl p-3 text-sm bg-white focus:outline-none focus:ring-2 focus:ring-blue-500">
                        <option value="TikTok">TikTok</option>
                        <option value="Instagram Reels">Instagram Reels</option>
                        <option value="YouTube Shorts">YouTube Shorts</option>
                    </select>
                </div>

                <div>
                    <label class="block text-sm font-semibold text-gray-700 mb-1">Link-ul Postării</label>
                    <input type="url" name="link_postare" placeholder="https://tiktok.com/@utilizator/video/..." required class="w-full border border-gray-300 rounded-xl p-3 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500" />
                </div>

                <button type="submit" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-semibold py-3 px-4 rounded-xl transition shadow-sm">
                    Trimite pentru Verificare
                </button>
            </form>
        </div>
    </main>

    <!-- Footer -->
    <footer class="max-w-7xl w-full mx-auto px-6 py-8 border-t border-gray-200 text-center text-xs text-gray-500">
        &copy; 2026 CutPays. Toate drepturile rezervate.
    </footer>

</body>
</html>
