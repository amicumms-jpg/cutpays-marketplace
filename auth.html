<!DOCTYPE html>
<html lang="ro">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CutPays - Autentificare</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body class="bg-gray-50 text-gray-900 font-sans antialiased flex items-center justify-center min-h-screen py-10">

    <div class="max-w-md w-full bg-white rounded-2xl border border-gray-200 shadow-sm p-8">
        <div class="text-center mb-6">
            <h1 class="text-2xl font-bold text-gray-900">Bine ai revenit</h1>
            <p class="text-gray-500 text-sm mt-1">Intră în contul tău CutPays</p>
        </div>

        <!-- Buton Autentificare cu Google -->
        <a href="dashboard.html" class="w-full flex items-center justify-center gap-3 border border-gray-300 hover:bg-gray-50 text-gray-700 font-semibold py-3 px-4 rounded-xl transition shadow-sm mb-6 text-sm">
            <svg class="w-5 h-5" viewBox="0 0 24 24">
                <path fill="#4285F4" d="M23.745 12.27c0-.7-.06-1.4-.19-2.07H12v4.51h6.6c-.29 1.52-1.14 2.82-2.4 3.68v3.05h3.88c2.27-2.09 3.66-5.17 3.66-9.17z"/>
                <path fill="#34A853" d="M12 24c3.24 0 5.95-1.08 7.93-2.91l-3.88-3.05c-1.08.72-2.45 1.16-4.05 1.16-3.13 0-5.78-2.11-6.73-4.96H1.18v3.15C3.15 21.3 7.22 24 12 24z"/>
                <path fill="#FBBC05" d="M5.27 14.24c-.25-.72-.38-1.49-.38-2.24s.13-1.52.38-2.24V6.6H1.18C.43 8.12 0 9.87 0 12s.43 3.88 1.18 5.4l4.09-3.16z"/>
                <path fill="#EA4335" d="M12 4.75c1.77 0 3.35.61 4.6 1.8l3.42-3.42C17.95 1.19 15.24 0 12 0 7.22 0 3.15 2.7 1.18 6.6l4.09 3.15c.95-2.85 3.6-4.96 6.73-4.96z"/>
            </svg>
            Continuă cu Google
        </a>

        <div class="flex items-center my-4">
            <div class="flex-grow border-t border-gray-200"></div>
            <span class="px-3 text-xs text-gray-400 uppercase font-semibold">sau cu e-mail</span>
            <div class="flex-grow border-t border-gray-200"></div>
        </div>

        <!-- Formular Clasic -->
        <form action="dashboard.html" method="GET" class="space-y-4">
            <div>
                <label class="block text-sm font-semibold text-gray-700 mb-1">Email</label>
                <input type="email" placeholder="nume@exemplu.com" required class="w-full border border-gray-300 rounded-xl p-3 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500" />
            </div>

            <div>
                <label class="block text-sm font-semibold text-gray-700 mb-1">Parolă</label>
                <input type="password" placeholder="••••••••" required class="w-full border border-gray-300 rounded-xl p-3 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500" />
            </div>

            <button type="submit" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-semibold py-3 px-4 rounded-xl transition shadow-sm text-center text-sm">
                Autentificare
            </button>
        </form>

        <!-- Comutator Creare Cont Nou / Login -->
        <div class="mt-6 text-center">
            <p class="text-sm text-gray-600">
                Nu ai un cont? 
                <a href="register.html" class="font-semibold text-blue-600 hover:underline">Creează cont nou</a>
            </p>
        </div>

        <div class="mt-4 text-center">
            <a href="index.html" class="text-xs font-semibold text-gray-500 hover:text-blue-600">← Înapoi la pagina principală</a>
        </div>
    </div>

</body>
</html>
