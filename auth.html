<!DOCTYPE html>
<html lang="ro">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CutPays - Autentificare</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body class="bg-gray-50 text-gray-900 font-sans antialiased flex items-center justify-center min-h-screen">

    <div class="max-w-md w-full bg-white rounded-2xl border border-gray-200 shadow-sm p-8">
        <div class="text-center mb-8">
            <h1 class="text-2xl font-bold text-gray-900">Intră în cont</h1>
            <p class="text-gray-500 text-sm mt-1">Platforma CutPays - Clipping</p>
        </div>

        <form class="space-y-4">
            <div>
                <label class="block text-sm font-semibold text-gray-700 mb-1">Email</label>
                <input type="email" placeholder="nume@exemplu.com" required class="w-full border border-gray-300 rounded-xl p-3 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500" />
            </div>

            <div>
                <label class="block text-sm font-semibold text-gray-700 mb-1">Parolă</label>
                <input type="password" placeholder="••••••••" required class="w-full border border-gray-300 rounded-xl p-3 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500" />
            </div>

            <a href="dashboard.html" class="block w-full bg-blue-600 hover:bg-blue-700 text-white font-semibold py-3 px-4 rounded-xl transition shadow-sm text-center">
                Autentificare
            </a>
        </form>

        <div class="mt-6 text-center">
            <a href="index.html" class="text-sm font-semibold text-blue-600 hover:underline">← Înapoi la pagina principală</a>
        </div>
    </div>

</body>
</html>
