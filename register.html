<!DOCTYPE html>
<html lang="ro">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CutPays - Creare Cont</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body class="bg-gray-50 text-gray-900 font-sans antialiased flex items-center justify-center min-h-screen py-10">

    <div class="max-w-md w-full bg-white rounded-2xl border border-gray-200 shadow-sm p-8">
        <div class="text-center mb-6">
            <h1 class="text-2xl font-bold text-gray-900">Creează un cont nou</h1>
            <p class="text-gray-500 text-sm mt-1">Începe să monetizezi clipurile pe CutPays</p>
        </div>

        <!-- Formular Înregistrare -->
        <form action="dashboard.html" method="GET" class="space-y-4">
            <div>
                <label class="block text-sm font-semibold text-gray-700 mb-1">Nume Complet</label>
                <input type="text" placeholder="Ion Popescu" required class="w-full border border-gray-300 rounded-xl p-3 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500" />
            </div>

            <div>
                <label class="block text-sm font-semibold text-gray-700 mb-1">Email</label>
                <input type="email" placeholder="nume@exemplu.com" required class="w-full border border-gray-300 rounded-xl p-3 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500" />
            </div>

            <div>
                <label class="block text-sm font-semibold text-gray-700 mb-1">Parolă</label>
                <input type="password" placeholder="••••••••" required class="w-full border border-gray-300 rounded-xl p-3 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500" />
            </div>

            <button type="submit" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-semibold py-3 px-4 rounded-xl transition shadow-sm text-center text-sm">
                Înregistrează-te
            </button>
        </form>

        <!-- Înapoi la Login -->
        <div class="mt-6 text-center">
            <p class="text-sm text-gray-600">
                Ai deja un cont? 
                <a href="auth.html" class="font-semibold text-blue-600 hover:underline">Intră în cont</a>
            </p>
        </div>

        <div class="mt-4 text-center">
            <a href="index.html" class="text-xs font-semibold text-gray-500 hover:text-blue-600">← Înapoi la pagina principală</a>
        </div>
    </div>

</body>
</html>
